# Local checks before each commit:  pre-commit install   (once)
# Run on everything:                pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-merge-conflict
      - id: check-added-large-files  # data and weights stay out of git
        args: [--maxkb=1024]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2  # same ruff as pyproject dev extra and CI
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(pdmfm|tests|scripts)/
      - id: ruff-format
        files: ^(pdmfm|tests|scripts)/
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
