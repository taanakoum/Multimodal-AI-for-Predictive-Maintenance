name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      quality:
        description: Run slow and optional-encoder checks
        type: boolean
        default: false
  schedule:
    - cron: "23 4 * * 0"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  PDMFM_DATA_ROOT: ${{ github.workspace }}/.ci-data
  PDMFM_TEST_THREADS: "2"
  UV_LINK_MODE: copy
  PYTHONIOENCODING: utf-8
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv venv
      - run: uv pip install "ruff==0.17.2" "actionlint-py==1.7.12.25"
      - run: uv run --no-sync ruff check pdmfm tests scripts
      - run: uv run --no-sync ruff format --check pdmfm tests scripts
      - run: uv run --no-sync actionlint -color
  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            coverage: true
            paths: tests
          - os: ubuntu-latest
            python: "3.12"
            coverage: false
            paths: tests
          - os: windows-latest
            python: "3.11"
            coverage: false
            paths: tests/unit tests/integration/test_readers.py tests/integration/test_windows.py tests/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install public package (CPU)
        shell: bash
        run: |
          uv venv
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[dev,eda]"
      - name: Core suite with coverage
        if: matrix.coverage
        shell: bash
        run: uv run --no-sync pytest --cov=pdmfm --cov-report=xml --cov-report=term-missing:skip-covered --junitxml=junit.xml
      - name: Compatibility and portable contracts
        if: ${{ !matrix.coverage }}
        shell: bash
        run: uv run --no-sync pytest ${{ matrix.paths }} --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: |
            junit.xml
            coverage.xml
  quality:
    if: github.event_name == 'schedule' || inputs.quality
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - shell: bash
        run: |
          uv venv
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[dev,eda,encoders]"
      - run: uv run --no-sync pytest -m "not acceptance" --durations=20
  types:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv venv
      - run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install -e ".[dev]"
      - run: uv run --no-sync pyright pdmfm
