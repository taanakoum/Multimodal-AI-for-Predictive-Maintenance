name: CI

# Lint, type-check and test on every push and pull request; datasets are never needed
# (tests that read real data skip themselves). See docs/CI.md.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PDMFM_DATA_ROOT: ${{ github.workspace }}/.ci-data  # empty: real-data tests skip
  UV_LINK_MODE: copy
  PYTHONIOENCODING: utf-8

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install lint tools
        # Same ruff as pyproject's dev extra and .pre-commit-config.yaml: formatting differs
        # between ruff versions, so an unpinned ruff could fail code that passes locally.
        run: |
          uv venv
          uv pip install "ruff==0.17.2" "actionlint-py==1.7.12.25"
      - name: Ruff lint
        run: uv run --no-sync ruff check pdmfm tests scripts
      - name: Ruff format
        run: uv run --no-sync ruff format --check pdmfm tests scripts
      - name: Workflow lint (actionlint, with shellcheck on run blocks)
        run: uv run --no-sync actionlint -color

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Optional repository secret with read access to the private OmniFuser repository.
      # Without it the OmniFuser-dependent tests skip. See docs/USER_ACTIONS.md.
      OMNIFUSER_READ_TOKEN: ${{ secrets.OMNIFUSER_READ_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Create environment
        shell: bash
        run: |
          uv venv
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[dev,eda]"
      - name: Install OmniFuser (optional, private repository)
        if: ${{ env.OMNIFUSER_READ_TOKEN != '' }}
        shell: bash
        run: >-
          uv pip install
          "omnifuser-reproduction @ git+https://x-access-token:${OMNIFUSER_READ_TOKEN}@github.com/taanakoum/OmniFuser.git@Ruche-OmniFuser-Training"
      - name: Entry points
        shell: bash
        run: |
          uv run --no-sync python -m pdmfm.fetch list
          uv run --no-sync python -m pdmfm.resources
      - name: Tests with coverage
        shell: bash
        run: >-
          uv run --no-sync pytest -rs
          --cov=pdmfm --cov-report=term-missing:skip-covered --cov-report=xml
          --junitxml=junit.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            junit.xml
            coverage.xml
          retention-days: 14

  types:
    name: Type check (pyright, advisory)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true  # reported, not blocking, until the codebase settles
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Create environment
        run: |
          uv venv
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[dev]"
      - name: Pyright
        run: uv run --no-sync pyright pdmfm
