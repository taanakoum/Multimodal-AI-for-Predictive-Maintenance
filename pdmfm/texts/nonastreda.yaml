# Nonastreda milling (wear classes by flank wear: below 71, 71 to 110, at least 110 um).
dataset: nonastreda
label_space: nonastreda3
context: >-
  CNC milling of C45 steel. Cutting forces in three axes measured with a Kistler 9257B
  dynamometer at 1 kHz; photographs of the tool, the chips and the workpiece after each pass.
templates:
  sharp:
    - A sharp milling cutter with little flank wear, below 71 micrometres.
    - A new or nearly new cutting tool with an intact cutting edge.
    - A milling tool at the start of its life, with minimal edge wear.
  used:
    - A used milling cutter with moderate flank wear, between 71 and 110 micrometres.
    - A cutting tool with a visibly worn but still serviceable edge.
    - A milling tool in mid-life, with medium flank wear.
  dulled:
    - A dull milling cutter with heavy flank wear, at least 110 micrometres.
    - A worn-out cutting tool whose edge needs replacing.
    - A milling tool at the end of its life, with severe flank wear.
classes:
  - sharp
  - used
  - dulled
